[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eidos-desktop"
version = "0.1.0"
description = "Голосовой настольный ассистент Eidos"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["PyQt6>=6.8,<7"]

[project.optional-dependencies]
voice = ["numpy>=1.26,<3", "sounddevice>=0.5,<0.6", "faster-whisper>=1.1,<2", "edge-tts>=7,<8"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["eidos*"]

[tool.setuptools.package-data]
eidos = ["assets/*.png", "assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
